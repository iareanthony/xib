{{- if and .Values.analysis.enabled .Values.analysis.archive.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sib-k8s.analysis.fullname" . }}-dashboard
  labels:
    grafana_dashboard: "1"
    {{- include "sib-k8s.analysis.labels" . | nindent 4 }}
data:
  ai-analysis.json: |
    {
      "annotations":{"list":[]},
      "description":"AI explanations and MITRE mappings generated from Falco alerts",
      "editable":true,
      "panels":[
        {
          "datasource":{"type":"loki","uid":"loki"},
          "fieldConfig":{"defaults":{},"overrides":[]},
          "gridPos":{"h":5,"w":8,"x":0,"y":0},
          "id":1,
          "options":{"colorMode":"value","graphMode":"area","justifyMode":"auto","orientation":"auto","reduceOptions":{"calcs":["sum"],"fields":"","values":false},"textMode":"auto"},
          "targets":[{"datasource":{"type":"loki","uid":"loki"},"expr":"sum(count_over_time({source=\"ai_analysis\"} [$__range]))","queryType":"instant","refId":"A"}],
          "title":"Analyses","type":"stat"
        },
        {
          "datasource":{"type":"loki","uid":"loki"},
          "fieldConfig":{"defaults":{},"overrides":[]},
          "gridPos":{"h":5,"w":16,"x":8,"y":0},
          "id":2,
          "options":{"legend":{"displayMode":"list","placement":"bottom","showLegend":true},"tooltip":{"mode":"single","sort":"none"}},
          "targets":[{"datasource":{"type":"loki","uid":"loki"},"expr":"sum by (priority) (count_over_time({source=\"ai_analysis\"} [$__interval]))","refId":"A"}],
          "title":"Analyses by Priority","type":"timeseries"
        },
        {
          "datasource":{"type":"loki","uid":"loki"},
          "fieldConfig":{"defaults":{"custom":{"align":"auto","cellOptions":{"type":"auto"},"inspect":false}},"overrides":[]},
          "gridPos":{"h":18,"w":24,"x":0,"y":5},
          "id":3,
          "options":{"cellHeight":"sm","showHeader":true},
          "targets":[{"datasource":{"type":"loki","uid":"loki"},"expr":"{source=\"ai_analysis\"} | json","maxLines":500,"refId":"A"}],
          "title":"AI Alert Analysis","transformations":[{"id":"extractFields","options":{"source":"Line"}},{"id":"organize","options":{"excludeByName":{"Line":true,"labels":true,"tsNs":true,"id":true},"indexByName":{"Time":0,"priority":1,"rule":2,"hostname":3,"analysis":4,"mitre_techniques":5,"analysis_time_ms":6,"cached":7}}}],"type":"table"
        }
      ],
      "refresh":"30s",
      "schemaVersion":41,
      "tags":["sib-k8s","falco","ai"],
      "templating":{"list":[]},
      "time":{"from":"now-24h","to":"now"},
      "timezone":"browser",
      "title":"SIB AI Analysis",
      "uid":"sib-ai-analysis",
      "version":1
    }
{{- end }}
