global:
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  storageClass: ""
  trustedCa:
    # Automatically use custom-ca/ca.crt when it exists in the chart directory.
    autoDiscover: true
    # ConfigMap containing one or more PEM root CAs. XIB appends these to the
    # public CA bundle. This takes precedence over auto-discovery.
    existingConfigMap: ""
    key: ca.crt
    bundleImage: alpine:3.22.1

xib:
  # Kept outside Helm's reserved global scope so this prefix is not inherited
  # by the vendored SIB dependency charts.
  imageRegistry: ghcr.io/iareanthony

platform:
  metrics:
    deploy: true
    image: victoriametrics/victoria-metrics:v1.121.0
    retention: 90d
    storage: 20Gi
  grafana:
    deploy: true
    image: grafana/grafana:12.1.0
    storage: 2Gi
    admin:
      existingSecret: ""
      userKey: admin-user
      passwordKey: admin-password
  prometheusOperator:
    enabled: false

aib:
  enabled: true
  image: aib:sha-94da209
  storage: 5Gi
  servicePort: 8080
  config: |
    storage:
      path: /data/aib.db
    server:
      listen: 0.0.0.0:8080
      read_only: true
    sources:
      kubernetes:
        - live: true
    scan:
      on_startup: true

vib:
  enabled: true
  image: xib-vib-scanner@sha256:99d65a24692a93b2136457d31e0b5cf633f4b54b7ca5be9d9004bf78ffa99224
  scanIntervalHours: "6"
  severityFilter: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
  additionalImages: ""
  dockerHosts: ""
  storage: 10Gi

cib:
  enabled: true
  image: xib-cib-checker@sha256:6e4835a6aee9469f6ff6a91ff7e77041afdfb841b3a56da5f091b5c240065439
  scanIntervalHours: "6"
  additionalImages: ""
  dockerHosts: ""
  storage: 10Gi

tib:
  enabled: true
  image: xib-tib-collector@sha256:78a779317c4546d15c6b964fc17fb08671ba2d25f9ffcd2af60c263894fae047
  syncIntervalHours: "6"
  storage: 5Gi
  feeds:
    # For an air-gapped cluster, serve mirrored files from an internal HTTP service.
    cisaKevUrl: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    epssApiUrl: https://api.first.org/data/v1/epss

iib:
  enabled: false
  image: xib-iib-monitor@sha256:3a21e3108865cc49b350a1d815e1bf95c01b7efaf182a7f5a55419898ca4d3b4
  authentikUrl: http://authentik-server.authentication.svc:80
  existingSecret: authentik-iib-monitor
  tokenKey: token
  intervalSeconds: "300"

pib:
  enabled: false
  image: xib-pib-monitor@sha256:c3bb209df286e34e64d939c66e05c20a078e732d152ca5429e670488498d43d4
  endpoints: ""
  intervalHours: "6"

sib:
  # SIB-K8s is vendored into this chart and installed as part of the XIB release.
  enabled: true
  global:
    namespace: xib-system
  auditPlugin:
    type: k8saudit
    k8saudit:
      enabled: true
      serviceType: ClusterIP
  syscallMonitoring:
    enabled: true
    driverKind: modern_ebpf
  analysis:
    # Requires a separately configured LLM endpoint and is not part of the
    # default test-cluster footprint.
    enabled: false
  falco:
    mounts:
      volumes:
        - name: xib-custom-ca
          configMap:
            name: xib-environment-ca
            items: [{key: ca.crt, path: ca.crt}]
        - {name: xib-trust, emptyDir: {}}
        - {name: xib-runtime, emptyDir: {}}
      volumeMounts:
        - {name: xib-trust, mountPath: /etc/xib/trust, readOnly: true}
        - {name: xib-runtime, mountPath: /tmp}
    extra:
      env:
        - {name: SSL_CERT_FILE, value: /etc/xib/trust/ca-bundle.crt}
        - {name: HOME, value: /tmp}
        - {name: XDG_CACHE_HOME, value: /tmp/.cache}
        - {name: XDG_CONFIG_HOME, value: /tmp/.config}
      initContainers:
        - name: build-trusted-ca-bundle
          image: alpine:3.22.1
          command: [sh, -c]
          args:
            - cat /etc/ssl/certs/ca-certificates.crt /xib-custom-ca/ca.crt > /xib-trust/ca-bundle.crt
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: xib-custom-ca, mountPath: /xib-custom-ca, readOnly: true}
            - {name: xib-trust, mountPath: /xib-trust}
    falcoctl:
      artifact:
        install:
          env:
            - {name: SSL_CERT_FILE, value: /etc/xib/trust/ca-bundle.crt}
            - {name: HOME, value: /tmp}
            - {name: XDG_CACHE_HOME, value: /tmp/.cache}
            - {name: XDG_CONFIG_HOME, value: /tmp/.config}
          mounts:
            volumeMounts:
              - {name: xib-trust, mountPath: /etc/xib/trust, readOnly: true}
              - {name: xib-runtime, mountPath: /tmp}
        follow:
          env:
            - {name: SSL_CERT_FILE, value: /etc/xib/trust/ca-bundle.crt}
            - {name: HOME, value: /tmp}
            - {name: XDG_CACHE_HOME, value: /tmp/.cache}
            - {name: XDG_CONFIG_HOME, value: /tmp/.config}
          mounts:
            volumeMounts:
              - {name: xib-trust, mountPath: /etc/xib/trust, readOnly: true}
              - {name: xib-runtime, mountPath: /tmp}
    falco:
      http_output:
        url: "http://xib-falcosidekick:2801"
  falcosidekick:
    fullnameOverride: xib-falcosidekick
    config:
      loki:
        hostport: "http://xib-loki:3100"
  loki:
    enabled: true
    fullnameOverride: xib-loki
  grafana:
    # XIB's Grafana loads the SIB dashboards and Loki datasource.
    enabled: false
